<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('ブックマーク')}"></head>
<body>
<div th:replace="~{fragments :: mainNav}"></div>
<main class="sheet container">
	<h1 class="page-title">ブックマーク</h1>
	<p class="lead">保存した書籍一覧です。</p>
	<div class="book-grid" th:if="${!#lists.isEmpty(books)}">
		<a class="card card--link book-card" th:each="book : ${books}" th:href="@{/books/{id}(id=${book.bookId})}">
			<div class="title" th:text="${book.title}">タイトル</div>
			<p class="meta" th:text="|著者: ${book.author}|">著者</p>
		</a>
	</div>
	<p class="muted" th:if="${#lists.isEmpty(books)}">ブックマークした書籍はまだありません。</p>
</main>
</body>
</html>
