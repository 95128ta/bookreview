<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('新規登録')}"></head>
<body>
<div th:replace="~{fragments :: mainNav}"></div>
<main class="sheet container container--narrow">
	<h1 class="page-title">新規登録</h1>
	<div class="card">
		<form class="form-stack" th:action="@{/register}" th:object="${form}" method="post">
			<label for="loginId">ログイン ID（3文字以上）</label>
			<input id="loginId" type="text" th:field="*{loginId}" autocomplete="username" required />
			<p class="err" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">error</p>
			<label for="password">パスワード（6文字以上）</label>
			<input id="password" type="password" th:field="*{password}" autocomplete="new-password" required />
			<p class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">error</p>
			<label for="userName">表示名</label>
			<input id="userName" type="text" th:field="*{userName}" autocomplete="nickname" required />
			<p class="err" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}">error</p>
			<div class="form-actions">
				<button type="submit" class="btn btn--primary">登録</button>
			</div>
		</form>
	</div>
	<p class="mt-lg muted"><a th:href="@{/login}">ログインへ戻る</a></p>
</main>
</body>
</html>
