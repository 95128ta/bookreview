<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('トップ')}"></head>
<body>
<div th:replace="~{fragments :: mainNav}"></div>
<main class="sheet container">
	<p class="alert alert--success" th:if="${withdrawnMessage != null and !#strings.isEmpty(withdrawnMessage)}" th:text="${withdrawnMessage}"></p>
	<h1 class="page-title">書籍レビュー</h1>
	<p class="lead">新着とおすすめの書籍を掲載しています。</p>
	<p>
		<a class="btn btn--books-cta" th:href="@{/books}">
			<span class="btn--books-cta__inner">
				<span class="btn--books-cta__title">書籍一覧へ</span>
				<span class="btn--books-cta__sub">検索して読む本を見つける</span>
			</span>
		</a>
	</p>
	<div class="card" sec:authorize="isAuthenticated()">
		<h2 class="section-title">読書中</h2>
		<p class="lead" style="margin-bottom: 0.8rem;">
			現在 <strong th:text="${readingCount != null ? readingCount : 0}">0</strong> 冊を読書中です。
		</p>
		<a class="btn btn--secondary btn--sm" th:href="@{/reading}">読書中の一覧を見る</a>
	</div>

	<h2 class="section-title" style="margin-top: 2rem;">新着書籍</h2>
	<div class="book-grid" th:if="${!#lists.isEmpty(recentBooks)}">
		<a class="card card--link book-card" th:each="book : ${recentBooks}" th:href="@{/books/{id}(id=${book.bookId})}">
			<div class="title" th:text="${book.title}">タイトル</div>
			<p class="meta" th:text="|著者: ${book.author}|">著者</p>
		</a>
	</div>
	<p class="muted" th:if="${#lists.isEmpty(recentBooks)}">表示できる書籍がありません。</p>

	<h2 class="section-title" style="margin-top: 2rem;">おすすめ書籍</h2>
	<div class="book-grid" th:if="${!#lists.isEmpty(recommendedBooks)}">
		<a class="card card--link book-card" th:each="book : ${recommendedBooks}" th:href="@{/books/{id}(id=${book.bookId})}">
			<div class="title" th:text="${book.title}">タイトル</div>
			<p class="meta" th:text="|著者: ${book.author}|">著者</p>
		</a>
	</div>
	<p class="muted" th:if="${#lists.isEmpty(recommendedBooks)}">表示できる書籍がありません。</p>
</main>
</body>
</html>
