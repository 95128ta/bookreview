<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('マイページ')}"></head>
<body>
<div th:replace="~{fragments :: mainNav}"></div>
<main class="sheet container container--form">
	<h1 class="page-title">マイページ</h1>
	<p class="msg-ok" th:if="${profileMessage != null and !#strings.isEmpty(profileMessage)}" th:text="${profileMessage}">ok</p>
	<p class="msg-err" th:if="${profileError != null and !#strings.isEmpty(profileError)}" th:text="${profileError}">err</p>
	<p class="msg-ok" th:if="${myReviewMessage != null and !#strings.isEmpty(myReviewMessage)}" th:text="${myReviewMessage}">ok</p>
	<p class="msg-err" th:if="${myReviewError != null and !#strings.isEmpty(myReviewError)}" th:text="${myReviewError}">err</p>

	<div class="card">
		<p class="muted" style="margin: 0 0 0.5rem;">ログイン ID</p>
		<p style="margin: 0 0 1rem; font-weight: 600;" th:text="${loginId}">id</p>
		<p class="muted" style="margin: 0 0 0.5rem;">表示名</p>
		<p style="margin: 0;" th:text="${displayName}">name</p>
		<p class="alert alert--success" style="margin-top: 1rem;" th:if="${admin}">管理者アカウントです。</p>
		<div class="muted" style="margin-top: 1rem; font-size: 0.9rem;" th:if="${stats != null}">
			レビュー <strong th:text="${stats.reviewCount}">0</strong> 件 ·
			ブックマーク <strong th:text="${stats.bookmarkCount}">0</strong> 件 ·
			読書ステータス <strong th:text="${stats.readingStatusCount}">0</strong> 件
		</div>
	</div>

	<section class="card panel my-reviews-section">
		<h2 class="section-title">自分のレビュー</h2>
		<p class="muted my-reviews-lead" th:if="${#lists.isEmpty(myReviews)}">まだレビューを投稿していません。書籍詳細から投稿できます。</p>
		<div class="my-reviews" th:if="${!#lists.isEmpty(myReviews)}">
			<article class="my-review-card" th:each="row : ${myReviews}">
				<div class="my-review-card__head">
					<a class="my-review-card__title" th:href="@{/books/{id}(id=${row.review.bookId})}" th:text="${row.bookTitle}">書籍タイトル</a>
					<a class="btn btn--secondary btn--sm" th:href="@{/books/{id}(id=${row.review.bookId})}">書籍ページへ</a>
				</div>
				<div class="my-review-card__meta">
					<time th:datetime="${row.review.createdAt}" th:text="${#temporals.format(row.review.createdAt, 'yyyy-MM-dd HH:mm')}">日時</time>
					<span class="my-review-card__sep" aria-hidden="true">·</span>
					<span th:text="${#numbers.formatDecimal(row.review.rating, 1, 1)} + ' 点'">5.0点</span>
					<span th:if="${row.review.spoiler != null and row.review.spoiler == 1}" class="spoiler">ネタバレあり</span>
				</div>
				<div class="my-review-card__body" th:if="${row.review.comment != null and !#strings.isEmpty(row.review.comment)}" th:text="${row.review.comment}">コメント</div>
				<p class="muted my-review-card__empty" th:if="${row.review.comment == null or #strings.isEmpty(row.review.comment)}">（コメントなし）</p>
				<div class="my-review-card__actions">
					<details class="my-review-edit">
						<summary class="my-review-edit__summary">編集</summary>
						<form class="form-stack my-review-edit__form" th:action="@{/profile/reviews/{rid}/update(rid=${row.review.reviewId})}" method="post">
							<label th:for="|rating-${row.review.reviewId}|">評価（0.5〜5）</label>
							<select th:id="|rating-${row.review.reviewId}|" name="rating" required>
								<option th:each="step : ${#numbers.sequence(1, 10)}"
										th:value="${step * 0.5}"
										th:selected="${row.review.rating != null and #numbers.formatDecimal(row.review.rating, 1, 1) == #numbers.formatDecimal(step * 0.5, 1, 1)}"
										th:text="${#numbers.formatDecimal(step * 0.5, 1, 1)} + ' 点'">1点</option>
							</select>
							<label th:for="|comment-${row.review.reviewId}|">コメント（任意、4000文字まで）</label>
							<textarea th:id="|comment-${row.review.reviewId}|" name="comment" maxlength="4000" rows="4" placeholder="感想を書いてください"
									th:text="${row.review.comment != null ? row.review.comment : ''}"></textarea>
							<label class="my-review-edit__check">
								<input type="checkbox" name="spoiler" value="true" th:checked="${row.review.spoiler != null and row.review.spoiler == 1}" />
								ネタバレを含む
							</label>
							<div class="form-actions">
								<button type="submit" class="btn btn--primary">更新</button>
							</div>
						</form>
					</details>
					<form class="form-inline" th:action="@{/profile/reviews/{rid}/delete(rid=${row.review.reviewId})}" method="post"
							onsubmit="return confirm('このレビューを削除しますか？');">
						<button type="submit" class="btn btn--danger btn--sm">削除</button>
					</form>
				</div>
			</article>
		</div>
	</section>

	<section class="card panel">
		<h2 class="section-title">表示名の変更</h2>
		<form class="form-stack" th:action="@{/profile/name}" method="post">
			<label for="userName">新しい表示名（1～100文字）</label>
			<input id="userName" type="text" name="userName" th:value="${displayName}" required />
			<div class="form-actions">
				<button type="submit" class="btn btn--primary">更新</button>
			</div>
		</form>
	</section>

	<section class="card panel">
		<h2 class="section-title">パスワードの変更</h2>
		<form class="form-stack" th:action="@{/profile/password}" method="post">
			<label for="currentPassword">現在のパスワード</label>
			<input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required />
			<label for="newPassword">新しいパスワード（6文字以上）</label>
			<input id="newPassword" type="password" name="newPassword" autocomplete="new-password" required />
			<div class="form-actions">
				<button type="submit" class="btn btn--primary">変更</button>
			</div>
		</form>
	</section>

	<section class="card panel">
		<h2 class="section-title">退会</h2>
		<p class="muted">退会するとアカウントと関連データが削除されます。</p>
		<form class="form-stack" th:action="@{/profile/withdraw}" method="post" onsubmit="return confirm('本当に退会しますか？');">
			<label for="withdrawPassword">パスワード（確認）</label>
			<input id="withdrawPassword" type="password" name="password" autocomplete="current-password" required />
			<div class="form-actions">
				<button type="submit" class="btn btn--danger">退会する</button>
			</div>
		</form>
	</section>
</main>
</body>
</html>
